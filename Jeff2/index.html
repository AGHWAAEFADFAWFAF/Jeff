<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Setting content="0; url=..." forces an immediate redirect -->
    <meta http-equiv="refresh" content="0; url=contents.txt">
    <title>Redirecting...</title>
</head>
<body>
    <p>If you are not redirected automatically, <a href="contents.txt">click here</a>.</p>
</body>
</html>
